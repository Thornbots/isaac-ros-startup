# /etc/systemd/logind.conf.d/thornbots.conf, installed by install.sh.
# The stack runs as the workspace owner's UID. With RemoveIPC=yes (the
# default), logind deletes that UID's /dev/shm files 10 s after its last
# login session ends, Fast DDS's shared-memory segments included, and
# nodes on the same host stop hearing each other (README.md, "RemoveIPC").
[Login]
RemoveIPC=no
