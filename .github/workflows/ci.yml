name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: Thornbots/thornbots_workspace/.github/workflows/quality.yml@aec2d6037a84052ed687a6c766cf882c88352bd0
    with:
      tooling-ref: aec2d6037a84052ed687a6c766cf882c88352bd0
      unit-suite: startup
